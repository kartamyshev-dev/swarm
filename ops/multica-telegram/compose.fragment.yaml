services:
  telegram-notifier:
    image: ${TELEGRAM_NOTIFIER_IMAGE:?Set pinned Python image}
    container_name: multica-telegram-notifier
    restart: unless-stopped
    user: "10001:10001"
    command: [python, -u, /app/notifier.py]
    volumes:
      - ./telegram-notifier/notifier.py:/app/notifier.py:ro
      - ./telegram-notifier/config.json:/app/config.json:ro
      - ./telegram-notifier/credentials.json:/app/credentials.json:ro
      - ./telegram-notifier/state:/state
    networks: [ingress]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 64m
    cpus: 0.10
    pids_limit: 32
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, /app/notifier.py, --health]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}
